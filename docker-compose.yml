services:
  postgres:
    image: postgres:15-alpine
    container_name: logicmap-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - logicmap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - logicmap-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logicmap-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logicmap-network

  python-service:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: logicmap-python-service
    ports:
      - "${PYTHON_SERVICE_PORT}:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - logicmap-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: logicmap-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL}
      - NODE_ENV=${NODE_ENV}
    depends_on:
      backend:
        condition: service_healthy
      python-service:
        condition: service_healthy
    networks:
      - logicmap-network

networks:
  logicmap-network:
    driver: bridge

volumes:
  logicmap-db-data:
